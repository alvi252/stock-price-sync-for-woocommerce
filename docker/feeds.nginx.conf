# Stand-in for a supplier's feed server in the local demo.
# Serves examples/ under /v1/ and requires an API key header, like real feeds often do.
server {
    listen 80;
    server_name _;

    location /v1/ {
        if ($http_x_api_key != "demo-key-2026") {
            return 401;
        }
        alias /feeds/;
        types {
            text/csv         csv;
            application/json json;
        }
        charset utf-8;
    }

    location / {
        return 404;
    }
}
