# Local demo and development environment. Not needed to use the plugin.
#
#   bin/demo-setup.sh          # start, install WordPress + WooCommerce, seed demo products
#   docker compose -p wsps-demo down -v
#
# WordPress: http://localhost:8088/wp-admin (admin / admin, local only).
name: wsps-demo

x-wp-env: &wp-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: wordpress
  WORDPRESS_DB_NAME: wordpress
  # Notices and warnings go to wp-content/debug.log, for web requests and WP-CLI alike.
  WORDPRESS_DEBUG: "1"
  WORDPRESS_CONFIG_EXTRA: |
    define( 'WP_DEBUG_LOG', true );
    define( 'WP_DEBUG_DISPLAY', false );

x-wp-volumes: &wp-volumes
  - wp-data:/var/www/html
  - ./:/var/www/html/wp-content/plugins/stock-price-sync-for-woocommerce:ro
  # Lets wp_safe_remote_get() reach the demo feed container on the private Docker network.
  - ./docker/mu-plugins:/var/www/html/wp-content/mu-plugins:ro

services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress:
    image: wordpress:php8.2-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WSPS_PORT:-8088}:80"
    environment: *wp-env
    volumes: *wp-volumes

  # Fake supplier feed server, reachable from WordPress as http://feeds.supplier.test
  feeds:
    image: nginx:1.27-alpine
    volumes:
      - ./examples:/feeds:ro
      - ./docker/feeds.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      default:
        aliases:
          - feeds.supplier.test

  # WP-CLI, run on demand: docker compose -p wsps-demo run --rm cli wp wsps sync --dry-run
  cli:
    image: wordpress:cli-php8.2
    profiles: ["cli"]
    user: "33:33"
    depends_on:
      - wordpress
    environment:
      <<: *wp-env
      HOME: /tmp
    volumes: *wp-volumes

volumes:
  db-data:
  wp-data:
